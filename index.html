<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초등학교 교육과정 대시보드</title>
    <style>
        body {
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        #dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            max-width: 900px;
            margin: 0 auto;
        }
        .subject-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .subject-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
        .icon {
            font-size: 40px;
            margin-bottom: 10px;
        }
        .subject-name {
            font-weight: bold;
            font-size: 1.1em;
        }
        #detail-view {
            display: none;
            background: white;
            max-width: 800px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .back-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 20px;
            font-size: 1em;
        }
        .back-btn:hover {
            background-color: #2980b9;
        }
        .section-title {
            color: #2c3e50;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 5px;
            margin-top: 20px;
        }
        .content-box {
            background: #f9fbfb;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <h1>초등학교 교육과정 대시보드</h1>

    <div id="dashboard"></div>

    <div id="detail-view">
        <button class="back-btn" onclick="showDashboard()">← 대시보드로 돌아가기</button>
        <h2 id="detail-title">과목명</h2>
        
        <h3 class="section-title">성격 및 목표</h3>
        <div id="detail-summary" class="content-box"></div>

        <h3 class="section-title">내용 체계 및 성취기준</h3>
        <div id="detail-standards" class="content-box"></div>

        <h3 class="section-title">교수·학습 및 평가 방향</h3>
        <div id="detail-teaching" class="content-box"></div>
    </div>

    <script>
        const curriculumData = {
            "바른 생활": {
                icon: "🌱",
                summary: "학생이 '지금-여기-우리 삶'을 지속적으로 성찰하는 가운데 구체적인 상황 속에서 바른 삶을 실천하도록 돕는 '실천 경험 중심 교과'입니다[cite: 11].",
                standards: "'우리는 누구로 살아갈까', '우리는 어디서 살아갈까', '우리는 지금 어떻게 살아갈까', '우리는 무엇을 하며 살아갈까'라는 네 개의 영역을 탈학문적 질문 형태로 제시합니다[cite: 11].",
                teaching: "덕목 중심의 표준적 태도나 행동을 습득하게 하는 것이 아니라, '맥락'과 '공동체'에 적절한 행위와 판단의 사례를 찾아보고 실천하면서 윤리적 감각을 기를 수 있습니다[cite: 11]."
            },
            "슬기로운 생활": {
                icon: "🔍",
                summary: "학생이 '지금-여기-우리 삶'에 관심을 갖고 적극적으로 탐구하는 가운데 자신이 살고 있는 세상을 경험하는 '탐구 경험 중심 교과'입니다[cite: 11].",
                standards: "자신과 주변에 관심을 가지고 질문을 제기하며 지속적으로 탐구합니다[cite: 11]. 탐구 과정에서 형성한 이해를 공동체와 공유하며 확장합니다[cite: 11].",
                teaching: "학생 내부에서 시작하는 흥미와 관심에 집중합니다[cite: 11]. 학생이 배움의 즐거움을 잃지 않고 생생한 학습이 이루어질 수 있도록 학습 환경을 구성합니다[cite: 11]."
            },
            "즐거운 생활": {
                icon: "🎵",
                summary: "학생이 놀이를 통해 '지금 - 여기 - 우리 삶'의 즐거움을 누리는 '놀이 경험 중심 교과'입니다[cite: 11].",
                standards: "문화 예술 활동과 신체 활동을 통해 지금을 즐기고, 자신이 속한 장소에서 놀이를 즐기며 감정과 정서를 표현합니다[cite: 11].",
                teaching: "학생이 일상생활 속에서 경험할 수 있는 구체적인 놀이뿐만 아니라 학생이 관심과 흥미를 갖고 스스로 몰입하여 즐길 수 있는 모든 경험을 포괄합니다[cite: 11]."
            },
            "창의적 체험활동": {
                icon: "💡",
                summary: "학생들이 건전하고 다양한 활동에 자발적으로 참여하여, 나눔과 배려를 실천하고 개인의 소질과 잠재력을 계발하며, 창의적인 삶의 태도와 공동체 의식을 함양하는 교육과정입니다[cite: 12].",
                standards: "창의적 체험활동은 자율·자치활동, 동아리 활동, 진로 활동의 세 영역으로 구성합니다[cite: 12].",
                teaching: "각 학교의 상황과 실정에 맞는 특색 있는 교육과정의 설계와 운영이 가능하므로, 학생의 삶과 연계된 교육과정을 설계하고 운영하는 데 초점을 두는 것이 중요합니다[cite: 12]."
            },
            "한국어": {
                icon: "🗣️",
                summary: "한국어 의사소통 능력이 없거나 현격히 부족한 학생을 대상으로 일상생활 및 학교생활에 필요한 기본적인 의사소통 한국어 능력을 함양합니다[cite: 13].",
                standards: "'한국어'의 교수·학습 내용은 '생활 한국어 교육'과 '학습 한국어 교육'으로 이루어집니다[cite: 13].",
                teaching: "학습자의 언어와 문화를 인정하고 존중하며 이들의 생활 경험을 교수·학습 내용과 통합함으로써 유의미한 학습 및 상호문화적 의사소통 능력을 함양하도록 합니다[cite: 13]."
            },
            "영어": {
                icon: "🔤",
                summary: "영어는 현재 국제적으로 가장 널리 통용되고 있는 언어로서 서로 다른 언어 및 문화 배경을 가진 사람 사이의 주요한 의사소통 수단입니다[cite: 14].",
                standards: "언어의 사회적 목적 관점에 따라 '이해(reception)'와 '표현(production)'의 두 가지 영역을 설정하였습니다[cite: 14].",
                teaching: "다양한 디지털 교수·학습 도구를 적극적으로 활용하여 지도합니다[cite: 14]. 생동감 있고 풍부한 영어 학습을 경험하고 디지털 소양을 기르게 합니다[cite: 14]."
            }
        };

        const dashboard = document.getElementById('dashboard');
        const detailView = document.getElementById('detail-view');

        function renderDashboard() {
            dashboard.innerHTML = '';
            for (const [subject, data] of Object.entries(curriculumData)) {
                const card = document.createElement('div');
                card.className = 'subject-card';
                card.onclick = () => showDetail(subject);
                
                card.innerHTML = `
                    <div class="icon">${data.icon}</div>
                    <div class="subject-name">${subject}</div>
                `;
                dashboard.appendChild(card);
            }
        }

        function showDetail(subject) {
            const data = curriculumData[subject];
            
            document.getElementById('detail-title').innerText = `${data.icon} ${subject} 교육과정`;
            document.getElementById('detail-summary').innerText = data.summary;
            document.getElementById('detail-standards').innerText = data.standards;
            document.getElementById('detail-teaching').innerText = data.teaching;

            dashboard.style.display = 'none';
            detailView.style.display = 'block';
        }

        function showDashboard() {
            detailView.style.display = 'none';
            dashboard.style.display = 'grid';
        }

        renderDashboard();
    </script>
</body>
</html>
